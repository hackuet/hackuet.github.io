      <rect x="293" y="115" width="8" height="11" rx="4" transform="rotate(135 297 155)" />
      <rect x="293" y="115" width="8" height="11" rx="4" transform="rotate(180 297 155)" />
      <rect x="293" y="115" width="8" height="11" rx="4" transform="rotate(225 297 155)" />
      <rect x="293" y="115" width="8" height="11" rx="4" transform="rotate(270 297 155)" />
      <rect x="293" y="115" width="8" height="11" rx="4" transform="rotate(315 297 155)" />
    </g>
  </g>
  <path d="M307 146.5A18.5 18.5 0 1 0 307 163.5Z" fill="#62c9d8" />
  <circle cx="297" cy="155" r="11" fill="#1672c4" />

  <!-- K -->
  <path d="M347 143v34M350 161 371 143M356 156 373 178" fill="none" stroke="#1672c4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Tagline -->
  <text x="157" y="216" font-family="'Arial Narrow', 'Roboto Condensed', 'Oswald', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-stretch="condensed" fill="#1f2433" textLength="198" lengthAdjust="spacingAndGlyphs">Hardware Acceleration Club of KUET</text>
</svg>

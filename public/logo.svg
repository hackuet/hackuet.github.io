<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 383 286" role="img" aria-labelledby="hack-logo-title">
  <title id="hack-logo-title">HACK: Hardware Acceleration Club of KUET</title>

  <!-- Forearm (pale), wrist cap and gripper -->
  <rect x="133" y="33" width="150" height="50" rx="13" fill="#9ad4e3" transform="rotate(38 208 58)" />
  <path d="M201 41 222 58" stroke="#fff" stroke-width="5" stroke-linecap="round" />
  <circle cx="236" cy="70" r="2.6" fill="#fff" />
  <g fill="none" stroke="#a9d9e2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M266 100 272 94 288 93 298 104 302 121" />
    <path d="M250 116 250 128 262 141" />
    <path d="M263 105 285 126" stroke-width="6" />
  </g>
  <path d="M231 107 262 82Q273 99 259 111 245 121 231 107Z" fill="#1672c4" />

  <!-- Upright (pale) -->
  <rect x="55" y="132" width="50" height="110" fill="#9ad4e3" />
  <path d="M63 161V172" stroke="#fff" stroke-width="3" stroke-linecap="round" />
  <circle cx="62" cy="181" r="1.6" fill="#fff" />

  <!-- Cable from the upper arm down to the base gear -->
  <path d="M147 95C157 114 149 132 134 142 116 153 112 168 122 183 132 198 132 215 106 222" fill="none" stroke="#3a4fa3" stroke-width="6" stroke-linecap="round" />
  <path d="M147 95C157 114 149 132 134 142 116 153 112 168 122 183 132 198 132 215 106 222" fill="none" stroke="#bfe3ee" stroke-width="6" stroke-dasharray="3 41" stroke-dashoffset="-6" />

  <!-- Base -->
  <path d="M8 283Q18 246 58 238H108Q146 248 154 283Z" fill="#3a4fa3" />
  <circle cx="123" cy="253" r="1.8" fill="#fff" />
  <circle cx="115" cy="270" r="1.8" fill="#fff" />

  <!-- Base gear -->
  <g fill="#3db8cb">
    <circle cx="80" cy="233" r="25" />
    <g>
      <circle cx="80" cy="206" r="4.5" />
      <circle cx="99.1" cy="213.9" r="4.5" />
      <circle cx="107" cy="233" r="4.5" />
      <circle cx="99.1" cy="252.1" r="4.5" />
      <circle cx="80" cy="260" r="4.5" />
      <circle cx="60.9" cy="252.1" r="4.5" />
      <circle cx="53" cy="233" r="4.5" />
      <circle cx="60.9" cy="213.9" r="4.5" />
    </g>
  </g>
  <circle cx="80" cy="233" r="15" fill="#9ad4e3" />
  <circle cx="80" cy="233" r="9" fill="#1672c4" />

  <!-- Upper arm (blue) with shoulder ring and elbow -->
  <rect x="41" y="61" width="152" height="54" rx="13" fill="#1672c4" transform="rotate(-43 117 88)" />
  <path d="M90 90 96 85" stroke="#fff" stroke-width="3" stroke-linecap="round" />
  <circle cx="107" cy="71" r="1.6" fill="#fff" />
  <circle cx="78" cy="127" r="20" fill="#9ad4e3" />
  <circle cx="78" cy="127" r="9" fill="#125fa6" />
  <circle cx="170" cy="32" r="13" fill="#2e9fdf" />

  <!-- H: a chip -->
  <g stroke="#3a4fa3" stroke-width="1.6" stroke-linecap="round">
    <path d="M155 131v6M160 131v6M165 131v6M170 131v6M175 131v6M180 131v6M185 131v6M155 182v7M160 182v7M165 182v7M170 182v7M175 182v7M180 182v7M185 182v7" />
    <path d="M140 144h7M140 149h7M140 154h7M140 159h7M140 164h7M140 169h7M140 174h7M193 144h7M193 149h7M193 154h7M193 159h7M193 164h7M193 169h7M193 174h7" />
  </g>
  <rect x="146" y="136" width="48" height="47" rx="3.5" fill="#3a4fa3" />
  <rect x="151" y="141" width="38" height="37" fill="#1672c4" stroke="#cfeff6" stroke-width="1" />
  <path d="M162 146v25M178 146v25M162 158.5h16" fill="none" stroke="#cfeff6" stroke-width="3.2" />

  <!-- A: a triangle -->
  <path d="M229 141 207 177.5H251Z" fill="none" stroke="#3a4fa3" stroke-width="3" stroke-linejoin="miter" />
  <path d="M229.5 157 221 171H238Z" fill="#34509f" />

  <!-- C: a gear with its mouth open to the right -->
  <g fill="#3db8cb">
    <path d="M326.8 146.5A31 31 0 1 0 326.8 163.5H307V146.5Z" />
    <g>
